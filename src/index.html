<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Thiệp Cưới</title>
  <meta name="description" content="Thiệp cưới trực tuyến" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
</head>

<body>

  <!-- Cover fullscreen -->
  <div id="cover-fullscreen" aria-hidden="true"></div>

  <!-- Particle canvas -->
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <!-- ====== INTRO ====== -->
  <div id="intro-screen">
    <div id="intro-card" role="button" tabindex="0" aria-label="Bấm để mở thiệp">
      <div class="intro-heart">♥</div>
      <div id="intro-names">
        <span id="intro-groom"></span>
        <span class="intro-amp">&amp;</span>
        <span id="intro-bride"></span>
      </div>
      <div class="intro-date" id="intro-date-text"></div>
      <div class="intro-subtitle">Thân Mời</div>
      <div class="intro-open-btn">Mở thiệp</div>
    </div>
  </div>

  <div class="page">

    <!-- ====== HERO — tên lớn ====== -->
    <section class="hero fade-in">
      <p class="hero-label" id="invite-title">Trân Trọng Kính Mời</p>
      <h1 class="hero-names">
        <span id="hero-groom"></span>
        <span class="hero-ampersand">&amp;</span>
        <span id="hero-bride"></span>
      </h1>
      <div id="hero-illustration" class="hero-illustration"></div>
    </section>

    <!-- ====== THÔNG TIN LỄ CƯỚI ====== -->
    <div class="card wedding-info-section fade-in">
      <div class="section-title">Thông Tin Lễ Cưới</div>

      <!-- Gia đình hai bên -->
      <div class="family-grid-top">
        <div class="family-col">
          <div class="family-col-label">Nhà Trai</div>
          <div class="family-col-parents">
            <span id="groom-father"></span><br>
            <span id="groom-mother"></span>
          </div>
        </div>
        <div class="family-col">
          <div class="family-col-label">Nhà Gái</div>
          <div class="family-col-parents">
            <span id="bride-father"></span><br>
            <span id="bride-mother"></span>
          </div>
        </div>
      </div>

      <div class="divider-line"><span>♥</span></div>

      <!-- Trân trọng báo tin -->
      <div class="wi-subtitle">Trân Trọng Báo Tin</div>
      <div class="wi-subtitle" style="font-size:0.65rem;letter-spacing:0.18em;margin-bottom:12px">Lễ Thành Hôn Của Con Chúng Tôi</div>

      <div class="wi-groom-name" id="wi-groom"></div>
      <div class="wi-script-and">&amp;</div>
      <div class="wi-bride-name" id="wi-bride"></div>

      <!-- Hôn lễ -->
      <div class="wi-time-block">
        <div class="wi-time-label">Hôn Lễ Sẽ Cử Hành Tại</div>
        <div class="wi-subtitle" id="wi-venue-name" style="font-size:0.8rem;letter-spacing:0.08em;margin:4px 0 2px;color:var(--text-light)"></div>
        <div class="wi-time-label" id="wi-venue-addr" style="margin-bottom:12px"></div>
        <div class="wi-time-label">Vào Lúc:</div>
        <div class="wi-time-value" id="wi-time"></div>
      </div>

      <!-- Ngày tháng lớn -->
      <div class="wi-date-row">
        <div class="wi-day-label" id="wi-dayname"></div>
        <div class="wi-day-num" id="wi-day"></div>
        <div class="wi-month-year">
          <div class="wi-month-num" id="wi-month"></div>
          <div class="wi-year-num" id="wi-year"></div>
        </div>
      </div>
      <div class="wi-lunar" id="wi-lunar"></div>
    </div>

    <!-- ====== LỄ ĂN HỎI (ẩn nếu không có) ====== -->
    <div id="engagement-section" class="card fade-in" style="display:none">
      <div class="section-title">Lễ Ăn Hỏi</div>
      <div class="event-box" id="event-engagement"></div>
    </div>

    <!-- ====== ALBUM ẢNH ====== -->
    <div id="album-section" class="card fade-in" style="display:none">
      <div class="section-title">Album Ảnh</div>
      <div id="album-grid" class="album-grid"></div>
    </div>

    <!-- ====== ĐẾM NGƯỢC + CALENDAR ====== -->
    <div class="card countdown-section fade-in">
      <div class="section-title">Cùng Đếm Ngược</div>
      <div class="countdown">
        <div class="cd-unit">
          <span class="cd-num" id="cd-days">--</span>
          <span class="cd-label">Ngày</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-unit">
          <span class="cd-num" id="cd-hours">--</span>
          <span class="cd-label">Giờ</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-unit">
          <span class="cd-num" id="cd-mins">--</span>
          <span class="cd-label">Phút</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-unit">
          <span class="cd-num" id="cd-secs">--</span>
          <span class="cd-label">Giây</span>
        </div>
      </div>

      <!-- Calendar widget -->
      <div class="calendar-widget" id="calendar-widget"></div>
    </div>

    <!-- ====== ĐỊA ĐIỂM ====== -->
    <div class="card venue-section fade-in">
      <div class="section-title">Tiệc Cưới Sẽ Tổ Chức Tại</div>
      <div class="venue-name" id="venue-name"></div>
      <div class="venue-address" id="venue-address"></div>
      <div class="venue-time-note" id="venue-time-note"></div>
      <div id="venue-map"></div>
    </div>

    <!-- ====== FOOTER ====== -->
    <footer class="footer fade-in">
      <p id="invite-message-footer"></p>
    </footer>

  </div><!-- /.page -->

  <!-- Album lightbox -->
  <div id="album-lightbox" class="album-lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh">
    <span class="album-lightbox-close" id="lb-close" aria-label="Đóng">&times;</span>
    <img id="lb-img" src="" alt="Ảnh album cưới" />
    <div class="album-lightbox-nav">
      <button id="lb-prev" aria-label="Ảnh trước">&#8592;</button>
      <button id="lb-next" aria-label="Ảnh kế">&#8594;</button>
    </div>
    <div class="album-lightbox-counter" id="lb-counter"></div>
  </div>

  <!-- Music player -->
  <div id="music-player" class="music-player" aria-label="Trình phát nhạc" style="display:none">
    <button id="music-toggle" class="music-toggle" aria-label="Bật/tắt nhạc">
      <span class="music-icon music-icon-play">♪</span>
      <span class="music-icon music-icon-pause" style="display:none">⏸</span>
    </button>
    <div class="music-info">
      <span id="music-track-name" class="music-track-name"></span>
      <div class="music-progress-bar"><div id="music-progress" class="music-progress"></div></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
